<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>IPA Synth — LangMap (experimental)</title>
<link rel="icon" type="image/png" sizes="48x48" href="/icon-48.png">
<style>
:root {
    --bg: #f7f5f1; --panel: #ffffff; --ink: #222; --muted: #6b6b6b; --line: #ddd6cb; --accent: #2e6fb8; --warn: #a4471d;
    --vt-skin: #f3d9c6; --vt-skin-line: #b98b6e; --vt-air: #fffaf4; --vt-bone: #ece6d8; --vt-bone-line: #a39780;
    --vt-tongue: #e07a7a; --vt-tongue-line: #a84848; --vt-tooth: #ffffff; --vt-velum: #d98f8f; --vt-flow: #2e6fb8;
    --vt-noise: #d0402f; --vt-text: #333; --vt-nasal: #cfe3f7; --vt-fold: #c46a6a; --vt-lip: #d88b84;
    --spec-bg: #ffffff; --pitch: #d0402f;
}
@media (prefers-color-scheme: dark) {
    :root {
        --bg: #17191c; --panel: #212428; --ink: #e8e6e3; --muted: #9a9a9a; --line: #3a3d42; --accent: #6ea8ec; --warn: #f0a070;
        --vt-skin: #4a3a33; --vt-skin-line: #8a6b5a; --vt-air: #1c1f23; --vt-bone: #5a564c; --vt-bone-line: #8f8573;
        --vt-tongue: #b55a5a; --vt-tongue-line: #e09a9a; --vt-tooth: #d8d4cc; --vt-velum: #a86a6a; --vt-flow: #6ea8ec;
        --vt-noise: #ff7a5c; --vt-text: #ddd; --vt-nasal: #23415f; --vt-fold: #c46a6a; --vt-lip: #a5615b;
        --spec-bg: #111; --pitch: #ff7a5c;
    }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; }
header { padding: 14px 16px 6px; max-width: 1100px; margin: 0 auto; }
header h1 { font-size: 20px; margin: 0; }
header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
main { max-width: 1100px; margin: 0 auto; padding: 8px 16px 40px; display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
@media (max-width: 820px) { main { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-width: 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
input[type=text] { flex: 1 1 220px; min-width: 0; font: 22px/1.3 "Doulos SIL", "Charis SIL", "Gentium Plus", "Noto Sans", system-ui, sans-serif; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
button, select { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
select { max-width: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chips button { font: 14px "Doulos SIL", "Charis SIL", "Noto Sans", system-ui, sans-serif; padding: 3px 9px; }
.chips button small { color: var(--muted); font-family: system-ui, sans-serif; }
#tract { width: 100%; aspect-ratio: 344 / 430; display: block; }
#now { display: flex; gap: 12px; align-items: baseline; min-height: 44px; }
#now .sym { font: 34px "Doulos SIL", "Charis SIL", "Noto Sans", serif; min-width: 1.5em; }
#now .desc { color: var(--muted); font-size: 14px; }
#timeline { width: 100%; height: 190px; display: block; cursor: crosshair; touch-action: none; }
#scrub { width: 100%; }
#segs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
#segs button { text-align: left; font-size: 12px; padding: 4px 8px; line-height: 1.3; }
#segs button b { font: 18px "Doulos SIL", "Charis SIL", "Noto Sans", serif; display: block; }
#warn { color: var(--warn); font-size: 13px; margin-top: 6px; }
.note { color: var(--muted); font-size: 12px; margin-top: 8px; }
label { font-size: 13px; color: var(--muted); }
.full { grid-column: 1 / -1; }
#wm { margin-top: 10px; }
#wm select { flex: 1 1 160px; }
</style>
</head>
<body>
<header>
    <h1 data-i18n="title">IPA Synth</h1>
    <p data-i18n="lead">Type IPA and hear a rule-based approximation, with the mouth and throat drawn as it speaks. Experimental: no native speaker has checked these sounds.</p>
</header>
<main>
    <section class="panel">
        <div class="row">
            <input id="ipa" type="text" value="ˈfɑːðə" spellcheck="false" autocomplete="off" aria-label="IPA">
            <button id="play" class="primary" data-i18n="play">▶ Speak</button>
        </div>
        <div class="row" style="margin-top:8px">
            <label><span data-i18n="voice">Voice</span>
                <select id="voice"><option value="male" data-i18n="male">male</option><option value="female" data-i18n="female">female</option><option value="child" data-i18n="child">child</option></select></label>
            <label><span data-i18n="speed">Speed</span>
                <select id="speed"><option value="1">1×</option><option value="2">½×</option><option value="4">¼×</option></select></label>
            <button id="wav" data-i18n="wav">Save WAV</button>
        </div>
        <div id="warn"></div>
        <div class="chips" id="examples"></div>
        <div id="wm">
            <div class="row">
                <select id="wmConcept" aria-label="Word Map concept"></select>
                <select id="wmLang" aria-label="Language"></select>
            </div>
            <div class="note" id="wmNote"></div>
        </div>
        <div id="segs"></div>
    </section>
    <section class="panel">
        <div id="now"><span class="sym" id="nowSym"></span><span class="desc" id="nowDesc"></span></div>
        <canvas id="tract" width="344" height="430" aria-label="vocal tract"></canvas>
    </section>
    <section class="panel full">
        <canvas id="timeline" aria-label="spectrogram and pitch"></canvas>
        <input id="scrub" type="range" min="0" max="1000" value="0" step="1" aria-label="time">
        <div class="note" data-i18n="timelineNote">Spectrogram 0–5 kHz (the horizontal bands are formants), pitch in red, segments below. Drag to look at any moment.</div>
    </section>
</main>
<script src="ipa_synth/engine.js"></script>
<script src="ipa_synth/tract.js"></script>
<script src="ipa_synth/index_data.js"></script>
<script>
(function () {
    'use strict';
    const params = new URLSearchParams(location.search);
    const LANG = (params.get('lang') || navigator.language || 'en').slice(0, 2) === 'ja' ? 'ja' : 'en';
    const T = {
        en: { title: 'IPA Synth', play: '▶ Speak', voice: 'Voice', male: 'male', female: 'female', child: 'child', speed: 'Speed', wav: 'Save WAV',
              lead: 'Type IPA and hear a rule-based approximation, with the mouth and throat drawn as it speaks. Experimental: no native speaker has checked these sounds.',
              timelineNote: 'Spectrogram 0–5 kHz (the horizontal bands are formants), pitch in red, segments below. Drag to look at any moment.',
              unsupported: 'Not synthesized (skipped): ', category: 'Tone numbers above 5 are tone categories, not pitch; played flat: ',
              glottis: 'glottis (top)', pick: '— Word Map word —', pickLang: '— language —', none: '(no IPA)',
              kinds: {} },
        ja: { title: 'IPA音声合成', play: '▶ 再生', voice: '声', male: '男性', female: '女性', child: '子ども', speed: '速さ', wav: 'WAV保存',
              lead: 'IPAを入力すると、規則で合成した近似音を鳴らし、口と喉の動きを断面図で表示します。試作版です。ネイティブによる確認はしていません。',
              timelineNote: 'スペクトログラム（0〜5 kHz、横に走る帯がフォルマント）、赤線が音の高さ、下段が分節音。ドラッグで任意の瞬間の形を表示します。',
              unsupported: '合成できない記号（読み飛ばし）：', category: '6以上の声調数字は調類番号で高さではないため、平らに鳴らしています：',
              glottis: '声門（上から）', pick: '— Word Map の単語 —', pickLang: '— 言語 —', none: '（IPAなし）',
              kinds: { closure: '閉鎖', burst: '破裂', aspiration: '気息', 'short lag': '開放', frication: '摩擦', fricative: '摩擦', vowel: '母音', nasal: '鼻音',
                       lateral: '側面音', approximant: '接近音', tap: 'はじき', 'trill contact': 'ふるえ（接触）', 'trill opening': 'ふるえ（開放）', 'glottal closure': '声門閉鎖',
                       'glottal hold': '声門閉鎖の保持', prenasal: '前鼻音', 'breathy release': '息もれ開放', release: '開放', 'offglide j': 'j のわたり', 'offglide w': 'w のわたり', rest: '', pause: '休止' } },
    }[LANG];
    document.documentElement.lang = LANG;
    document.querySelectorAll('[data-i18n]').forEach(el => { const k = el.dataset.i18n; if (T[k]) el.textContent = T[k]; });
    document.title = T.title + ' — LangMap';

    const EXAMPLES = [
        ['ˈfɑːðə', 'English father'], ['ma˥ ma˧˥ ma˨˩˦ ma˥˩', 'Mandarin 4 tones'], ['ʂʅ˥˩ tsɿ˥', 'Mandarin apical vowels'],
        ['kʰa ka ɡa', 'aspiration'], ['ǃa ǀa ǁa ᵑǃa', 'clicks'], ['kʼa tsʼa', 'ejectives'], ['ɓa ɗa', 'implosives'],
        ['ɔ̀kɔ́ ọkọ', 'tone marks'], ['ʁ χ ħ ʕ ʔ h', 'back fricatives'], ['ra ɾa ɹa ʀa', 'r sounds'], ['bõ.ʒuʁ', 'French nasal'],
        ['ʃt͡ʃ ʂ ɕ', 'sibilants'], ['i y ɨ ʉ ɯ u', 'close vowels'], ['ŋ̍˨˩', 'syllabic nasal'],
    ];
    const $ = id => document.getElementById(id);
    const ex = $('examples');
    for (const [ipa, label] of EXAMPLES) {
        const b = document.createElement('button');
        b.innerHTML = ''; b.append(ipa + ' '); const sm = document.createElement('small'); sm.textContent = label; b.append(sm);
        b.onclick = () => { $('ipa').value = ipa; build(); play(); };
        ex.append(b);
    }

    let pickedLang = '', pickedIpa = '';
    let AC = null, plan = null, audio = null, source = null, startAt = 0, playing = false, cursor = 0, spec = null;
    const S = window.IPASynth;

    function build() {
        const ds = +$('speed').value;
        plan = S.plan($('ipa').value, { durScale: ds, lang: pickedLang && $('ipa').value === pickedIpa ? pickedLang : '' });
        audio = S.render(plan, { voice: $('voice').value });
        spec = spectrogram(audio.samples, audio.fs);
        cursor = 0;
        // warnings
        const w = [];
        if (plan.parsed.unsupported.length) w.push(T.unsupported + plan.parsed.unsupported.map(c => c.length === 1 && /[̀-ͯ]/.test(c) ? '◌' + c : c).join(' '));
        const cats = [...new Set(plan.segs.filter(s => s.toneCategory).map(s => s.toneCategory))];
        if (cats.length) w.push(T.category + cats.join(', '));
        $('warn').textContent = w.join(' · ');
        // segment buttons
        const box = $('segs'); box.innerHTML = '';
        plan.segs.forEach((s, i) => {
            const b = document.createElement('button');
            const sym = document.createElement('b'); sym.textContent = s.sym + (s.asp ? 'ʰ' : '') + (s.ejective ? 'ʼ' : '') + (s.long ? 'ː' : '') + (s.nasalized ? '̃' : '');
            b.append(sym, S.describe(s, LANG));
            b.onclick = () => { stop(); const ph = plan.phases.find(p => p.seg === i && p.kind !== 'closure') || plan.phases.find(p => p.seg === i); cursor = ph.t0 + ph.dur / 2; frame(); };
            box.append(b);
        });
        frame();
    }

    function play() {
        if (!plan) build();
        AC = AC || new (window.AudioContext || window.webkitAudioContext)();
        if (AC.state === 'suspended') AC.resume();
        stop();
        const buf = AC.createBuffer(1, audio.samples.length, audio.fs);
        buf.copyToChannel ? buf.copyToChannel(audio.samples, 0) : buf.getChannelData(0).set(audio.samples);
        source = AC.createBufferSource(); source.buffer = buf; source.connect(AC.destination);
        startAt = AC.currentTime + .03; source.start(startAt);
        playing = true;
        source.onended = () => { playing = false; };
        requestAnimationFrame(loop);
    }
    function stop() { if (source) { try { source.stop(); } catch (e) {} source = null; } playing = false; }
    function loop() {
        if (!playing) { frame(); return; }
        cursor = Math.max(0, (AC.currentTime - startAt) * 1000);
        if (cursor > plan.T) { playing = false; cursor = plan.T; }
        frame();
        requestAnimationFrame(loop);
    }

    function frame() {
        if (!plan) return;
        const st = S.sample(plan, cursor);
        const ph = st.phase, seg = ph && ph.seg >= 0 ? plan.segs[ph.seg] : null;
        VocalTract.draw($('tract'), st, { time: performance.now(), seg, phase: ph, labels: T });
        $('nowSym').textContent = seg ? seg.sym : '';
        $('nowDesc').textContent = seg ? S.describe(seg, LANG) + (ph.kind && ph.kind !== 'vowel' ? ' · ' + (T.kinds[ph.kind] != null ? T.kinds[ph.kind] : ph.kind) : '') : '';
        $('scrub').value = Math.round(1000 * cursor / plan.T);
        drawTimeline();
    }

    // ---------------- spectrogram
    function fft(re, im) {
        const n = re.length;
        for (let i = 1, j = 0; i < n; i++) { let bit = n >> 1; for (; j & bit; bit >>= 1) j ^= bit; j ^= bit; if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; } }
        for (let len = 2; len <= n; len <<= 1) {
            const a = -2 * Math.PI / len, wr = Math.cos(a), wi = Math.sin(a);
            for (let i = 0; i < n; i += len) {
                let cr = 1, ci = 0;
                for (let j = 0; j < len / 2; j++) {
                    const ur = re[i + j], ui = im[i + j], vr = re[i + j + len / 2] * cr - im[i + j + len / 2] * ci, vi = re[i + j + len / 2] * ci + im[i + j + len / 2] * cr;
                    re[i + j] = ur + vr; im[i + j] = ui + vi; re[i + j + len / 2] = ur - vr; im[i + j + len / 2] = ui - vi;
                    const nr = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = nr;
                }
            }
        }
    }
    function spectrogram(x, fs) {
        const N = 256, hop = 64, maxBin = Math.floor(5000 / fs * N);
        const cols = [];
        const win = new Float32Array(N).map((_, i) => .5 - .5 * Math.cos(2 * Math.PI * i / (N - 1)));
        let max = -1e9;
        for (let s = 0; s + N < x.length; s += hop) {
            const re = new Float32Array(N), im = new Float32Array(N);
            for (let i = 0; i < N; i++) re[i] = (x[s + i] - (i ? .95 * x[s + i - 1] : 0)) * win[i];
            fft(re, im);
            const col = new Float32Array(maxBin);
            for (let b = 0; b < maxBin; b++) { col[b] = 10 * Math.log10(re[b] * re[b] + im[b] * im[b] + 1e-12); if (col[b] > max) max = col[b]; }
            cols.push(col);
        }
        return { cols, max, hop, fs, maxBin };
    }
    function drawTimeline() {
        const cv = $('timeline'), ctx = cv.getContext('2d'), dpr = window.devicePixelRatio || 1;
        const w = cv.clientWidth, h = cv.clientHeight;
        if (cv.width !== Math.round(w * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const cs = getComputedStyle(document.documentElement);
        const bg = cs.getPropertyValue('--spec-bg').trim(), ink = cs.getPropertyValue('--ink').trim(), line = cs.getPropertyValue('--line').trim();
        const dark = matchMedia('(prefers-color-scheme: dark)').matches;
        ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);
        const sh = h - 40;
        // spectrogram image, cached per render
        if (spec && (!spec.img || spec.img.w !== w || spec.img.dark !== dark)) {
            const off = document.createElement('canvas'); off.width = spec.cols.length; off.height = spec.maxBin;
            const o = off.getContext('2d'), im = o.createImageData(off.width, off.height);
            for (let c = 0; c < spec.cols.length; c++) for (let b = 0; b < spec.maxBin; b++) {
                const v = Math.max(0, Math.min(1, (spec.cols[c][b] - spec.max + 60) / 60));
                const g = dark ? Math.round(v * 255) : Math.round(255 - v * 255);
                const p = ((spec.maxBin - 1 - b) * off.width + c) * 4; im.data[p] = im.data[p + 1] = im.data[p + 2] = g; im.data[p + 3] = 255;
            }
            o.putImageData(im, 0, 0); spec.img = { c: off, w, dark };
        }
        const X = tm => tm / plan.T * w;
        if (spec && spec.img) { ctx.imageSmoothingEnabled = true; ctx.drawImage(spec.img.c, 0, 0, spec.cols.length * spec.hop / spec.fs * 1000 / plan.T * w, sh); }
        // pitch
        ctx.strokeStyle = cs.getPropertyValue('--pitch').trim(); ctx.lineWidth = 2; ctx.beginPath();
        let pen = false;
        for (let px = 0; px <= w; px += 2) {
            const tm = px / w * plan.T, st = S.sample(plan, tm);
            const y = sh - (st.level - .5) / 5.5 * sh;
            if (st.AV > .3) { pen ? ctx.lineTo(px, y) : ctx.moveTo(px, y); pen = true; } else pen = false;
        }
        ctx.stroke();
        // segments
        ctx.font = '14px "Doulos SIL","Charis SIL","Noto Sans",serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        plan.segs.forEach((s, i) => {
            const ps = plan.phases.filter(p => p.seg === i); if (!ps.length) return;
            const a = X(ps[0].t0), b = X(ps[ps.length - 1].t1);
            ctx.fillStyle = s.type === 'V' ? 'rgba(46,111,184,.18)' : 'rgba(160,160,160,.18)';
            ctx.fillRect(a + .5, sh + 4, b - a - 1, 30);
            ctx.fillStyle = ink; ctx.fillText(s.sym, (a + b) / 2, sh + 19);
        });
        ctx.strokeStyle = line; ctx.beginPath(); ctx.moveTo(0, sh + .5); ctx.lineTo(w, sh + .5); ctx.stroke();
        // playhead
        ctx.strokeStyle = cs.getPropertyValue('--accent').trim(); ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(X(cursor), 0); ctx.lineTo(X(cursor), h); ctx.stroke();
    }
    const seek = e => { const r = $('timeline').getBoundingClientRect(); stop(); cursor = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * plan.T; frame(); };
    $('timeline').addEventListener('pointerdown', e => { seek(e); $('timeline').setPointerCapture(e.pointerId); });
    $('timeline').addEventListener('pointermove', e => { if (e.buttons) seek(e); });
    $('scrub').addEventListener('input', () => { stop(); cursor = $('scrub').value / 1000 * plan.T; frame(); });

    $('play').onclick = () => { build(); play(); };
    $('ipa').addEventListener('keydown', e => { if (e.key === 'Enter') { build(); play(); } });
    $('ipa').addEventListener('input', () => { clearTimeout(build.t); build.t = setTimeout(build, 250); });
    $('voice').onchange = () => build();
    $('speed').onchange = () => build();
    $('wav').onclick = () => {
        if (!audio) build();
        const blob = new Blob([S.toWav(audio.samples, audio.fs)], { type: 'audio/wav' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'ipa.wav'; a.click();
    };
    window.addEventListener('resize', () => frame());
    // keep the glottis moving while paused on a voiced moment
    setInterval(() => { if (!playing && plan) { const st = S.sample(plan, cursor); if (st.AV > .05) frame(); } }, 60);

    // ---------------- Word Map picker
    const IDX = window.IPA_SYNTH_INDEX;
    window.WORDS = window.WORDS || {};
    const cSel = $('wmConcept'), lSel = $('wmLang');
    cSel.append(new Option(T.pick, ''));
    for (const [id, en, ja] of IDX.concepts.slice().sort((a, b) => (LANG === 'ja' && a[2] && b[2] ? a[2].localeCompare(b[2], 'ja') : a[1].localeCompare(b[1])))) cSel.append(new Option(LANG === 'ja' && ja ? ja + ' (' + en + ')' : en, id));
    lSel.append(new Option(T.pickLang, ''));
    const langName = c => { const n = IDX.names[c]; return n ? (LANG === 'ja' && n[1] ? n[1] : n[0]) : c; };
    function loadConcept(id, then) {
        if (!id) return;
        if (window.WORDS[id]) return then();
        const s = document.createElement('script'); s.src = 'words/' + id + '.js'; s.onload = then; document.head.append(s);
    }
    cSel.onchange = () => loadConcept(cSel.value, () => {
        const d = window.WORDS[cSel.value].data, keep = lSel.value;
        lSel.innerHTML = ''; lSel.append(new Option(T.pickLang, ''));
        Object.keys(d).filter(c => d[c] && d[c][1] && d[c][1] !== '—').sort((a, b) => langName(a).localeCompare(langName(b), LANG)).forEach(c => lSel.append(new Option(langName(c) + ' — ' + d[c][0], c)));
        if (keep && d[keep]) { lSel.value = keep; lSel.onchange(); }
    });
    lSel.onchange = () => {
        const w = window.WORDS[cSel.value], c = lSel.value; if (!w || !c) return;
        const cell = w.data[c];
        $('ipa').value = cell[1]; pickedLang = c; pickedIpa = cell[1];
        $('wmNote').textContent = langName(c) + ': ' + cell[0] + '  [' + cell[1] + ']';
        build(); play();
    };

    if (params.get('ipa')) $('ipa').value = params.get('ipa');
    build();
})();
</script>
</body>
</html>
